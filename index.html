<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Obat Program - Malaria</title>
<style>
  /* --- CSS SAMA PERSIS SEPERTI SEBELUMNYA --- */
  :root{
    --primary:#0f6b52; --primary-dark:#0a4d3a; --bg:#f4f7f6; --card:#ffffff;
    --border:#dbe4e1; --text:#1f2d29; --muted:#6b7a75; --danger:#c0392b; --warn:#e08e0b;
    --sidebar-width:220px;
    --header-h:72px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  
  header{background:var(--primary);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:var(--header-h);}
  header h1{font-size:18px;margin:0;}
  header p{font-size:12px;opacity:.85;margin:0;}
  .btn-home{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-home:hover{background:rgba(255,255,255,.25);}

  .app-layout{display:flex;flex:1;overflow:hidden;}
  
  .sidebar{
    width:var(--sidebar-width);
    min-width:var(--sidebar-width);
    background:var(--primary-dark);
    overflow-y:auto;
    flex-shrink:0;
    padding:8px 0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sidebar .menu-label{
    color:rgba(255,255,255,.4);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    padding:12px 16px 4px;
    font-weight:700;
  }
  .sidebar button.menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:10px 16px;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:rgba(255,255,255,.7);
    font-size:13px;
    cursor:pointer;
    text-align:left;
    transition:all .15s;
    font-weight:500;
  }
  .sidebar button.menu-item:hover{
    background:rgba(255,255,255,.08);
    color:#fff;
  }
  .sidebar button.menu-item.active{
    background:rgba(255,255,255,.12);
    border-left-color:#ffd166;
    color:#fff;
    font-weight:600;
  }
  .sidebar button.menu-item .icon{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
  .sidebar .menu-divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:4px 12px;
  }

  .main-content{
    flex:1;
    overflow-y:auto;
    padding:20px 24px 40px;
    background:var(--bg);
  }
  .main-content .tab{display:none;}
  .main-content .tab.active{display:block;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;}
  .card h2{margin-top:0;font-size:17px;color:var(--primary-dark);}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:6px;}
  fieldset{border:1px solid var(--border);border-radius:8px;margin:16px 0 0;padding:14px;}
  legend{font-size:13px;font-weight:700;color:var(--primary-dark);padding:0 6px;}
  .required::after{content:" *";color:var(--danger);}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button.btn{cursor:pointer;border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:#e8efec;color:var(--primary-dark);}
  .btn-danger{background:#fdecea;color:var(--danger);}
  .msg{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none;}
  .msg.ok{background:#e6f4ea;color:#1e7e34;display:block;}
  .msg.err{background:#fdecea;color:var(--danger);display:block;}
  .msg.info{background:#eaf2fb;color:#2a5885;display:block;}
  
  .table-wrap{overflow-x:auto;max-height:460px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  th{background:#eef4f2;color:var(--primary-dark);position:sticky;top:0;}
  .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .toolbar input{max-width:260px;}
  .badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
  .badge.falciparum{background:#fdecea;color:#c0392b;}
  .badge.vivax{background:#fff4e0;color:#b3760a;}
  .badge.mix{background:#eee0fd;color:#6c3fc0;}
  .badge.negatif{background:#e6f4ea;color:#1e7e34;}
  .row-actions button{padding:4px 8px;font-size:12px;}
  .empty-state{text-align:center;color:var(--muted);padding:30px 0;}
  .info-line{font-size:12px;color:var(--muted);margin:-4px 0 12px;}
  .info-line.warn{color:var(--danger);font-weight:600;}
  
  .obat-table-wrap{overflow-x:auto;}
  .obat-table{width:100%;border-collapse:collapse;min-width:720px;}
  .obat-table th{font-size:12px;color:var(--muted);text-align:left;padding:0 6px 6px;font-weight:600;}
  .obat-table td{padding:4px 6px;vertical-align:top;}
  .obat-table td.obat-nama{font-size:13px;font-weight:700;color:var(--primary-dark);padding-top:12px;white-space:nowrap;}
  .obat-table input{padding:8px;}
  .col-jumlah{width:15%;} .col-dosis{width:13%;} .col-frek{width:13%;} .col-lama{width:15%;} .col-ket{width:30%;}
  
  .stok-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;}
  @media(max-width:640px){.stok-summary{grid-template-columns:1fr;}}
  .stok-box{border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;}
  .stok-box .num{font-size:26px;font-weight:800;color:var(--primary-dark);}
  .stok-box.warn .num{color:var(--danger);}
  .stok-box .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  
  .tgljam{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;}
  .config-box{font-size:12px;color:var(--muted);}
  
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;display:none;}
  .modal-box{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .modal-head h3{margin:0;font-size:16px;color:var(--primary-dark);}
  .btn-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);}
  #notePreview{width:100%;min-height:340px;font-family:'Consolas',monospace;font-size:13px;white-space:pre;line-height:1.5;}
  
  .sidebar::-webkit-scrollbar{width:4px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
  .sidebar::-webkit-scrollbar-track{background:transparent;}
  
  @media(max-width:768px){
    :root{--sidebar-width:180px;}
    .sidebar button.menu-item{font-size:12px;padding:8px 12px;}
    .sidebar button.menu-item .icon{font-size:16px;width:24px;}
    .main-content{padding:12px;}
  }
  @media(max-width:480px){
    :root{--sidebar-width:0px;}
    .sidebar{display:none !important;}
    .mobile-menu-toggle{display:block !important;}
    .sidebar.open{display:flex !important;position:fixed;top:var(--header-h);left:0;bottom:0;width:260px;z-index:50;box-shadow:2px 0 12px rgba(0,0,0,.3);}
  }
  .mobile-menu-toggle{display:none;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:18px;cursor:pointer;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;}
  .sidebar-backdrop.active{display:block;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- ===== HTML STRUKTUR SAMA PERSIS SEPERTI SEBELUMNYA ===== -->
<header>
  <div style="display:flex;align-items:center;gap:12px;">

    <div>
      <h1>🩺 Rekapitulasi Obat Program</h1>

    </div>
  </div>

<div class="app-layout">

    <button class="menu-item active" data-program="malaria"><span class="icon">🦟</span> Malaria</button>
    <button class="menu-item" data-program="hyperhep"><span class="icon">💉</span> Hyperhep</button>

    <button class="menu-item" data-program="rabies"><span class="icon">🐕</span> Rabies</button>

<script>
// =================================================================
// PERBAIKAN: CACHING DATA UNTUK MEMPERCEPAT BACA DATABASE
// =================================================================
(function(){
  "use strict";

  var STORE_KEY = 'malariaAppConfig';
  var DEFAULT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwVFA2HcKjfmQlcLm8OTMU8kS2EMD9cE1yGkN_aRa9XGjiTkSTTrPCGdy6yUI0sp7vw/exec';
  var state = { 
    webAppUrl: DEFAULT_WEBAPP_URL,
    // Cache untuk setiap sheet
    cache: {
      Malaria: null,        // data pasien malaria
      MalariaLab: null,     // data lab malaria
      HyperhepPasien: null, // data pasien hyperhep
      Tuberkulin: null,     // data tuberkulin
      RabiesPasien: null,   // data pasien rabies
      HyperhepStok: null,   // data stok hyperhep (digunakan untuk ringkasan)
      RabiesStok: null      // data stok rabies
    }
  };

  // ---------- STORAGE ----------
  function safeGetStorage(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function safeSetStorage(key, val){ try { localStorage.setItem(key, val); return true; } catch(e){ return false; } }

  function loadConfig(){
    var raw = safeGetStorage(STORE_KEY);
    if (raw){
      try { var cfg = JSON.parse(raw); if (cfg.webAppUrl) { state.webAppUrl = cfg.webAppUrl; } } catch(e){}
    }
  }

  // ---------- FUNGSI GET DATA DENGAN CACHE ----------
  function getDataWithCache(sheetName, forceRefresh, callback) {
    // Jika cache ada dan tidak force refresh, langsung callback dengan data
    if (!forceRefresh && state.cache[sheetName] !== null) {
      callback(null, state.cache[sheetName]);
      return;
    }

    // Jika tidak ada cache atau force refresh, fetch dari server
    if (!state.webAppUrl) {
      callback('URL Web App belum diatur.', null);
      return;
    }

    getFromSheet(sheetName)
      .then(function(json){
        if (json.status === 'success') {
          state.cache[sheetName] = json.data || [];
          callback(null, state.cache[sheetName]);
        } else {
          callback(json.message || 'Gagal memuat data', null);
        }
      })
      .catch(function(err){
        callback(err.message, null);
      });
  }

  // Fungsi asli getFromSheet tetap dipakai
  function getFromSheet(sheetName){
    var sep = state.webAppUrl.indexOf('?') > -1 ? '&' : '?';
    var url = state.webAppUrl + sep + 'sheet=' + encodeURIComponent(sheetName);
    return fetch(url, { method: 'GET' }).then(function(res){ return res.json(); });
  }

  // Fungsi post tetap sama
  function postToSheet(sheetName, payload){
    var body = {};
    Object.keys(payload).forEach(function(k){ body[k] = payload[k]; });
    body._target = sheetName;
    return fetch(state.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function(res){ return res.json(); });
  }

  // ---------- NAVIGASI SIDEBAR (tidak berubah) ----------
  function initSidebarNavigation(){
    document.querySelectorAll('.sidebar button[data-program]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var program = btn.dataset.program;
        document.querySelectorAll('.sidebar button[data-program]').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var firstSub = document.querySelector('.sidebar button.sub-item[data-parent="' + program + '"]');
        if (firstSub) { firstSub.click(); }
        closeMobileSidebar();
      });
    });

    document.querySelectorAll('.sidebar button.sub-item, .sidebar button[data-tab="setting"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tabId = btn.dataset.tab;
        if (!tabId) return;
        document.querySelectorAll('.sidebar button.sub-item, .sidebar button[data-tab="setting"]').forEach(function(b){
          b.classList.remove('active');
        });
        btn.classList.add('active');
        document.querySelectorAll('.main-content .tab').forEach(function(t){ t.classList.remove('active'); t.style.display = 'none'; });
        var target = document.getElementById('tab-' + tabId);
        if (target) { target.style.display = 'block'; target.classList.add('active'); }
        onTabOpened(tabId);
        closeMobileSidebar();
      });
    });

    document.getElementById('btnGoHome').addEventListener('click', function(){
      document.querySelectorAll('.sidebar button').forEach(function(b){ b.classList.remove('active'); });
      var malariaBtn = document.querySelector('.sidebar button[data-program="malaria"]');
      if (malariaBtn) malariaBtn.classList.add('active');
      var inputSub = document.querySelector('.sidebar button.sub-item[data-tab="malaria-input"]');
      if (inputSub) inputSub.click();
    });

    var sidebar = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebarBackdrop');
    document.getElementById('mobileMenuToggle').addEventListener('click', function(){
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active');
    });
    backdrop.addEventListener('click', closeMobileSidebar);
    function closeMobileSidebar(){
      sidebar.classList.remove('open');
      backdrop.classList.remove('active');
    }
  }

  // ---------- TAB OPENED - PERBAIKAN DENGAN CACHE ----------
  function onTabOpened(tabId){
    // Laporan Malaria
    if (tabId === 'malaria-laporan') {
      // Gunakan cache dengan forceRefresh = false (default)
      getDataWithCache('Malaria', false, function(err, data){
        if (err) {
          showMsg('msgLaporan', 'Gagal memuat data: ' + err, 'err');
          renderLaporan([]);
          return;
        }
        state.data = data;
        hideMsg('msgLaporan');
        populateFilterTahunMalaria(data);
        applyFilter();
      });
      // Tampilkan loading
      showMsg('msgLaporan', 'Memuat data dari cache/server...', 'info');
    }

    // Laporan Lab Malaria
    if (tabId === 'malaria-lab-laporan') {
      getDataWithCache('MalariaLab', false, function(err, data){
        if (err) {
          showMsg('msgMalariaLabLaporan', 'Gagal memuat data: ' + err, 'err');
          renderMalariaLabLaporan([]);
          return;
        }
        state.malariaLabData = data;
        hideMsg('msgMalariaLabLaporan');
        populateFilterTahunMalariaLab(data);
        applyFilterMalariaLab();
      });
      showMsg('msgMalariaLabLaporan', 'Memuat data...', 'info');
    }

    // Hyperhep Stok
    if (tabId === 'hyperhep-stok') {
      // Stok butuh dua sheet, kita fetch keduanya dengan cache
      getDataWithCache('HyperhepStok', false, function(errStok, stokData){
        if (errStok) { showMsg('msgHyperhepStok', 'Gagal memuat stok: ' + errStok, 'err'); return; }
        getDataWithCache('HyperhepPasien', false, function(errPasien, pasienData){
          if (errPasien) { showMsg('msgHyperhepStok', 'Gagal memuat data pasien: ' + errPasien, 'err'); return; }
          // Hitung ringkasan
          var masuk = 0;
          stokData.forEach(function(r){ masuk += parseFloat(r.jumlahVialMasuk) || 0; });
          var terpakai = pasienData.length;
          var sisa = masuk - terpakai;
          document.getElementById('stokMasukTotal').textContent = masuk;
          document.getElementById('stokTerpakaiTotal').textContent = terpakai;
          document.getElementById('stokSisaTotal').textContent = sisa;
          document.getElementById('stokSisaBox').classList.toggle('warn', sisa <= 5);
          renderStokRiwayat(stokData);
          hideMsg('msgHyperhepStok');
        });
      });
      showMsg('msgHyperhepStok', 'Memuat data stok...', 'info');
    }

    // Hyperhep Pasien (info stok)
    if (tabId === 'hyperhep-pasien') {
      updateInfoSisaStok();
    }

    // Hyperhep Laporan
    if (tabId === 'hyperhep-laporan') {
      getDataWithCache('HyperhepPasien', false, function(err, data){
        if (err) {
          showMsg('msgHyperhepLaporan', 'Gagal memuat data: ' + err, 'err');
          renderHyperhepLaporan([]);
          return;
        }
        state.hyperhepData = data;
        hideMsg('msgHyperhepLaporan');
        populateFilterTahunHyperhep(data);
        applyFilterHyperhep();
      });
      showMsg('msgHyperhepLaporan', 'Memuat data...', 'info');
    }

    // Tuberkulin Laporan
    if (tabId === 'tuberkulin-laporan') {
      getDataWithCache('Tuberkulin', false, function(err, data){
        if (err) {
          showMsg('msgTuberkulinLaporan', 'Gagal memuat data: ' + err, 'err');
          renderTuberkulinLaporan([]);
          return;
        }
        state.tuberkulinData = data;
        hideMsg('msgTuberkulinLaporan');
        populateFilterTahunTuberkulin(data);
        applyFilterTuberkulin();
      });
      showMsg('msgTuberkulinLaporan', 'Memuat data...', 'info');
    }

    // Rabies Stok
    if (tabId === 'rabies-stok') {
      getDataWithCache('RabiesStok', false, function(errStok, stokData){
        if (errStok) { showMsg('msgRabiesStok', 'Gagal memuat stok: ' + errStok, 'err'); return; }
        getDataWithCache('RabiesPasien', false, function(errPasien, pasienData){
          if (errPasien) { showMsg('msgRabiesStok', 'Gagal memuat data pasien: ' + errPasien, 'err'); return; }
          var masuk = 0;
          stokData.forEach(function(r){ masuk += parseFloat(r.jumlahVialMasuk) || 0; });
          var terpakai = 0;
          pasienData.forEach(function(r){ terpakai += parseFloat(r.jumlahVialRabies) || 0; });
          var sisa = masuk - terpakai;
          document.getElementById('stokMasukTotalRabies').textContent = masuk;
          document.getElementById('stokTerpakaiTotalRabies').textContent = terpakai;
          document.getElementById('stokSisaTotalRabies').textContent = sisa;
          document.getElementById('stokSisaBoxRabies').classList.toggle('warn', sisa <= 5);
          renderStokRiwayatRabies(stokData);
          hideMsg('msgRabiesStok');
        });
      });
      showMsg('msgRabiesStok', 'Memuat data stok...', 'info');
    }

    // Rabies Pasien (info stok)
    if (tabId === 'rabies-pasien') {
      updateInfoSisaStokRabies();
    }

    // Rabies Laporan
    if (tabId === 'rabies-laporan') {
      getDataWithCache('RabiesPasien', false, function(err, data){
        if (err) {
          showMsg('msgRabiesLaporan', 'Gagal memuat data: ' + err, 'err');
          renderRabiesLaporan([]);
          return;
        }
        state.rabiesData = data;
        hideMsg('msgRabiesLaporan');
        populateFilterTahunRabies(data);
        applyFilterRabies();
      });
      showMsg('msgRabiesLaporan', 'Memuat data...', 'info');
    }
  }

  function refreshHyperhepStok(){
    // Force refresh kedua sheet
    getDataWithCache('HyperhepStok', true, function(errStok, stokData){
      if (errStok) { showMsg('msgHyperhepStok', 'Gagal memuat stok: ' + errStok, 'err'); return; }
      getDataWithCache('HyperhepPasien', true, function(errPasien, pasienData){
        if (errPasien) { showMsg('msgHyperhepStok', 'Gagal memuat data pasien: ' + errPasien, 'err'); return; }
        var masuk = 0;
        stokData.forEach(function(r){ masuk += parseFloat(r.jumlahVialMasuk) || 0; });
        var terpakai = pasienData.length;
        var sisa = masuk - terpakai;
        document.getElementById('stokMasukTotal').textContent = masuk;
        document.getElementById('stokTerpakaiTotal').textContent = terpakai;
        document.getElementById('stokSisaTotal').textContent = sisa;
        document.getElementById('stokSisaBox').classList.toggle('warn', sisa <= 5);
        renderStokRiwayat(stokData);
        hideMsg('msgHyperhepStok');
      });
    });
    showMsg('msgHyperhepStok', 'Memuat ulang data stok...', 'info');
  }

      getDataWithCache('RabiesPasien', true, function(errPasien, pasienData){

        var masuk = 0;
        stokData.forEach(function(r){ masuk += parseFloat(r.jumlahVialMasuk) || 0; });

        var sisa = masuk - terpakai;
        document.getElementById('stokMasukTotalRabies').textContent = masuk;
        document.getElementById('stokTerpakaiTotalRabies').textContent = terpakai;
